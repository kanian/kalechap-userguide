site_name: Guide utilisateur de Kalechap
theme:
  name: material
  language: fr
  favicon: assets/favicon.svg
  palette:
    # Light Mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: orange
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre

    # Dark Mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: orange
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

nav:
  - Premiers pas:
      - Accueil: index.md
      - Page d'accueil (Landing): landing.md
      - Inscription: inscription.md
      - Inscription en tant qu'agence: inscription-agence.md
      - Connexion: connexion.md
      - Souscription: subscription.md
      - Profil: profil.md
      - Paramètres du compte: parametres-compte.md
  - Utilisation (Demandeur):
      - Rechercher un service: rechercher-service.md
      - Demander un service: service-request.md
      - Suivre mes demandes: mes-demandes.md
      - Évaluations et avis: evaluations.md
  - Utilisation (Prestataire):
      - Ajouter une offre de service: ajouter-offre.md
      - Gérer les demandes reçues: demandes-recues.md
      - Évaluations et avis: evaluations.md
      - Nombre d'offres de service: nombre-offres-service.md
      - Ajouter une image à une offre: ajouter-image-offre-service.md
      - Ajouter une photo de profil: add-profile-picture.md
  - Autres:
      - Code de parrainage: code-parrainage.md
  - Apprentissage:
      - Mode apprentissage: learn/